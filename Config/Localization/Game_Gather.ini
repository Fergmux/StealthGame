; The Game localisation gather target (Objectives Chain story oc-002, ADR-0020 E6): FText in a cooked data asset is
; localisable only when the asset's path is inside a gather target. The Objectives chain asset folder is gathered
; (StealthGame.Objectives.ChainAssetId parses this file and asserts the IncludePathFilters entry). Run with:
;   UnrealEditor-Cmd StealthGame.uproject -run=GatherText -config="Config/Localization/Game_Gather.ini"
[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
NativeCulture=en
CulturesToGenerate=en

;Gather text from assets: the Objectives chain asset folder (card titles and lines)
[GatherTextStep0]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/StealthGame/Objectives/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false

;Write the manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write the archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
