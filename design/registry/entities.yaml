formulas:
  - name: hide_event_posterior
    status: active
    source: design/gdd/information-visibility-policy.md
    referenced_by:
      - design/gdd/information-visibility-policy.md
      - design/gdd/concealment-bushes.md
      - design/gdd/crowd-npc-behaviour.md
      - design/gdd/tuning-data-config.md
    variables:
      - n_P
      - n_N
      - r_P
      - r_N
      - k
      - b
      - P_hide
    output_range: [0, 1]
    expression: "P_hide = n_P*r_P / (n_P*r_P + n_N*r_N); pass iff P_hide <= k*b"
    notes: "IVP F5. k = 1.5 is the ceiling and is never raised to meet Crowd (review ruling A). Concealment F2 and Crowd F2 derive the required NPC bush-use rate from it."
    added: 2026-10-24
    revised: ""
  - name: npc_bush_use_rate_target
    status: active
    source: design/gdd/concealment-bushes.md
    referenced_by:
      - design/gdd/concealment-bushes.md
      - design/gdd/crowd-npc-behaviour.md
      - design/gdd/tuning-data-config.md
    variables:
      - r_P
      - n_P
      - n_N
      - k
      - b
      - r_N_req
    output_range: "[0, inf)"
    expression: "r_N_req = r_P * n_P * (1 - k*b) / (k*b*n_N), b = n_P / (n_P + n_N)"
    notes: "Concealment F2; 0.625 * r_P at defaults (k 1.5). Feeds Crowd bush-use tuning."
    added: 2026-10-24
    revised: ""
  - name: red_herring_rate_per_tell
    status: active
    source: design/gdd/crowd-npc-behaviour.md
    referenced_by:
      - design/gdd/crowd-npc-behaviour.md
      - design/gdd/assassination-defence-reversal.md
      - design/gdd/concealment-bushes.md
      - design/gdd/information-visibility-policy.md
