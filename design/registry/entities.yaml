    expression: "BlindGuessSuccess = 1 - (1 - p)^L, p = TeamSize / (TeamSize + NpcCount); DutyCycle = DefenceDurationSec / DefenceCooldownSec"
    notes: "TDC F-3; invariant I-4 REJECTS the preset (Default and HostSelectable presets; a non-selectable test preset only warns) when 100 * BlindGuessSuccess >= BlindGuessWarnPct (50). 0.249 at defaults (NpcCount 50; was 0.298 at 40)."
