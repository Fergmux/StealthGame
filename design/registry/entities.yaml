    variables:
      - r_P
      - n_P
      - n_N
      - P_star
      - r_N
      - Lambda
      - T_gap
      - a_j
    output_range: "(0, inf)"
    expression: "r_N = r_P * n_P * (1 - P*) / (P* * n_N)"
    notes: "Crowd F2 (tell rate). Floor 25 % of the table default for every SCL, IIF or Concealment tell. Objectives F3 uses its inverse for tends."
    added: 2026-10-24
    revised: ""
