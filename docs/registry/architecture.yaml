    adr: docs/architecture/adr-0010-shared-pawn-cmc-possession.md
    added: 2026-10-24
  - pattern: ai_velocity_driving
    status: active
    description: "Moving a visible pawn by path-following RequestDirectMove/RequestPathMove, direct velocity, SetActorLocation, launch or teleport; AI movement enters only through UPawnCommandComponent::Move"
    why: "AI input must share the human command path, shaping and commanded displacement (ADR-0001 §2)"
    adr: docs/architecture/adr-0010-shared-pawn-cmc-possession.md
    added: 2026-10-24
  - pattern: movement_rule_reads_playerstate
    status: active
    description: "Any movement rule (speed, gait clamp, traversal permission) reading a PlayerState, controller class or team; participant state only via IGaitLegalitySource"
    why: "The prototype's IsInformant()-from-PlayerState clamp is a kind-keyed branch and depends on a pointer that is owner-only"
    adr: docs/architecture/adr-0010-shared-pawn-cmc-possession.md
    added: 2026-10-24
  - pattern: handover_hold_via_force_position_update
    status: active
    description: "Simulating the AI-to-player hand-over hold with ForcePositionUpdate or anything that advances the CMC client timestamps before the new owner's first ServerMove"
    why: "Advanced CurrentClientTimeStamp makes the server reject the owner's first moves; ForcePositionUpdate asserts on the host's own pawn (verified 5.8.4)"
    adr: docs/architecture/adr-0010-shared-pawn-cmc-possession.md
    added: 2026-10-24
  - pattern: mover_plugin_use
    status: active
    description: "Referencing Mover, ChaosMover or NetworkPrediction types from project code, Blueprints or assets"
    why: "Experimental in 5.8; the MVP commits to the CMC"
    adr: docs/architecture/adr-0010-shared-pawn-cmc-possession.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0011 ---
  - pattern: caller_identity_in_command_path
    status: active
    description: "Any entry point, payload, event, listener or predicate carrying IsAI/IsPlayer, a controller, PlayerState or team, or calling IsPlayerControlled/IsLocallyControlled/IsBotControlled/Roster binding queries"
