# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  # --- from adr-registry-staging\ADR-0001 ---
  - purpose: replication_system
    status: active
    api: "legacy UNetDriver replication; net.Iris.UseIrisReplication=0 pinned (config edit pending user); harness asserts at startup"
    not: "Iris; ReplicationGraph"
    adr: docs/architecture/adr-0001-crowd-identity-rules.md
    reason: "Iris off by default in 5.8.4 and Beta-flagged; pointer trimming under Iris unverified (S7); ReplicationGraph filters actors not properties and replaces IsNetRelevantFor"
    referenced_by:
      - docs/architecture/adr-0001-crowd-identity-rules.md
    added: 2026-10-24
    revised: ""
  - purpose: pawn_possession_pointer_suppression
    status: active
    api: "ResetReplicatedLifetimeProperty (by name) for APawn::PlayerState; RESET_REPLIFETIME_CONDITION for APawn::Controller and AActor::Owner; all COND_OwnerOnly on AStealthPawn class"
    not: "per-actor active-override toggle; NPC PlayerStates; per-team replica actors"
    adr: docs/architecture/adr-0001-crowd-identity-rules.md
    reason: "Uniform class-level condition gives identical non-owner bunch class for player and NPC pawns (S1)"
    referenced_by:
      - docs/architecture/adr-0001-crowd-identity-rules.md
    added: 2026-10-24
    revised: ""
  # --- from adr-registry-staging\ADR-0002 ---
  - purpose: gameplay_event_ordering_and_timers
    status: active
    api: "Custom FTickFunction (FResolutionDrainTickFunction) in TG_PostPhysics, authority only; due-time heap via UResolutionQueue::ScheduleAt"
    not: "FTimerManager, feature ticks, latent actions, tick-order assumptions"
    adr: docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    reason: "Cross-actor tick order is unspecified; one drain gives one reproducible, server-secret total order"
    referenced_by:
      - docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-24
    revised: ""
  - purpose: client_server_time
    status: active
    api: "EstimatedServerNow() from an owner-only four-timestamp clock exchange (ServerClockPing/ClientClockPong on AStealthPlayerController), min-delay filter, slewed and monotonic"
    not: "AGameStateBase::GetServerWorldTimeSeconds (no RTT compensation, float delta)"
    adr: docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    reason: "Accuracy budget p95 <= 15 ms at LeakNetProfile for contact-timed presentation"
    referenced_by:
      - docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-24
    revised: ""
  # --- from adr-registry-staging\ADR-0003 ---
  - purpose: concealment_cull_mechanism
    status: active
    api: "AStealthPawn::IsNetRelevantFor override (no Super) + explicit UNetConnection::FindActorChannelRef(Pawn)->Close(EChannelCloseReason::Relevancy) at a global grid deadline in a TG_PostUpdateWork tick (legacy NetDriver)"
    not: "relevancy override alone (RelevantTimeout lag); dormancy; net cull distance; client-side hide only; Iris filters (ADR-0024); ReplicationGraph"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    reason: "Quantised, kind-blind, ack-free cull at one boundary per frame (IVP R7.2); legacy closes open channels only after RelevantTimeout"
    referenced_by:
      - docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    added: 2026-10-24
    revised: ""
  - purpose: pawn_net_config
    status: active
