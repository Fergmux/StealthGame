    added: 2026-10-24
  - pattern: client_side_layout_generation
    status: active
    description: "Clients never run the City Generator, draw geometry randomness or hold navigation data; they build geometry only from a complete FLayoutManifest."
    why: "LSC R2.2: clients build exactly what the server validated; per-machine generation desyncs and hands clients generator internals."
    adr: docs/architecture/adr-0014-layout-service-generation-navmesh.md
    added: 2026-10-24
  - pattern: replicated_layout_actors
    status: active
    description: "The layout contract spawns no replicated actor; geometry, bush hide volumes, court fixtures and traversal coping are built locally from the Manifest as non-replicated components."
    why: "LSC R2.6 / ADR-0003: per-site replicated objects risk role tells through NetGUIDs, spawn order or net settings."
    adr: docs/architecture/adr-0014-layout-service-generation-navmesh.md
    added: 2026-10-24
  - pattern: role_data_in_manifest
    status: active
    description: "FLayoutManifest carries only LayoutId, ProviderKind, GeneratorKitVersion, LayoutAttempt, LayoutHash, EntryCount and geometry entries; never roles, socket records, sub-seeds or a hash of the Selection. A new field is a Visibility Policy change request (schema change)."
    why: "The Manifest is All-audience public state (LSC R2.5, R4.4)."
    adr: docs/architecture/adr-0014-layout-service-generation-navmesh.md
    added: 2026-10-24
