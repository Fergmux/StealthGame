# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  # --- from adr-registry-staging\ADR-0001 ---
  - pattern: kind_keyed_branch
    status: active
    description: "No code on the pawn, its components, AnimBP, audio or presentation may branch on IsPlayerControlled/IsBotControlled, controller class, PlayerState presence, team or Roster state for anything another client can observe"
    why: "Any player/NPC difference is a Pillar-1 detector"
    adr: docs/architecture/adr-0001-crowd-identity-rules.md
    added: 2026-10-24
  - pattern: npc_specific_pawn_or_component
    status: active
    description: "No NPC subclass, NPC-only component, per-instance replication flag or net-config difference; one AStealthPawn class for every body"
    why: "Class, component or config differences are visible in packets and on screen"
    adr: docs/architecture/adr-0001-crowd-identity-rules.md
    added: 2026-10-24
  - pattern: client_reads_pawn_identity_pointers
    status: active
    description: "Client code must not read a pawn's PlayerState/Controller/Owner, PlayerState->GetPawn(), or iterate world pawns to find people"
    why: "These pointers are owner-only; derivations reintroduce the prototype's IsNpc() leak"
    adr: docs/architecture/adr-0001-crowd-identity-rules.md
    added: 2026-10-24
  - pattern: team_or_state_on_public_carrier
    status: active
    description: "Team, participant state, connection, appearance or pawn data must never be replicated on a pawn or a PlayerState; Team/Owner data only on the receiving player's own PlayerController"
    why: "The prototype's replicated PlayerState Team/LifeState let every client map teams"
    adr: docs/architecture/adr-0001-crowd-identity-rules.md
    added: 2026-10-24
  - pattern: ai_keyed_animation_lod
    status: active
    description: "Animation tiering, URO, budget allocation, mesh LOD and audio concurrency take only screen height and the eye-mask rendered flag"
    why: "Kind-dependent animation fidelity is a visual tell (IVP L18)"
    adr: docs/architecture/adr-0001-crowd-identity-rules.md
    added: 2026-10-24
  - pattern: engine_spectator_state
    status: active
    description: "Never enter NAME_Spectating/NAME_Inactive, use ASpectatorPawn, spectator RPCs or bIsSpectator"
    why: "Spectator RPCs cycle PlayerArray (humans only) and bIsSpectator replicates to all"
    adr: docs/architecture/adr-0001-crowd-identity-rules.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0002 ---
  - pattern: feature_local_event_ordering
    status: active
    description: "No system may order events against another system's events with its own clock, timestamp, timer or tick order; use queue keys"
    why: "Breaks the no-ties total order and reproducibility"
    adr: docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-24
  - pattern: gameplay_mutation_outside_drain
    status: active
    description: "Gameplay state changes only inside queue slots (command RPC bodies only push to mailboxes); the round-end step in the staging pass is the single named exception"
    why: "Preserves one authoritative order and the latch"
    adr: docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-24
  - pattern: inline_actor_destroy_in_resolver
    status: active
    description: "Resolvers never destroy actors inline; use RequestTeardown and treat pending-teardown actors as gone"
    why: "Avoids CMC destroy inside TG_PostPhysics and stale weak handles"
    adr: docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-24
  - pattern: presentation_on_arrival_or_engine_server_time
    status: active
    description: "Client presentation never schedules from replication arrival, GetServerWorldTimeSeconds or wall clock; only EstimatedServerNow()"
    why: "Arrival order and jitter must never carry meaning"
    adr: docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-24
  - pattern: observable_round_end_at_latch_for_strikes
    status: active
    description: "The latch step replicates and presents nothing; a strike-decided round's observable end is bound to the deciding death write"
    why: "Otherwise the result is revealed before the blow lands (cross-review S-B1)"
    adr: docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-24
  # --- architecture-review fix 2026-10-25 (ADR-0002 §2a, ADR-0007 §4) ---
  - pattern: feature_declared_queue_payload
    status: active
    description: "A feature module must never declare a type that FQueueItem or FStagedWrite names (payload struct, pawn handle, timer payload); queue payloads, FPawnHandle and FSubjectRef live in StealthFoundation Public/Server, and feature timers map onto the generic FTimerPayload"
    why: "Foundation cannot include StealthGameplay (ADR-0007 lint (e)); a feature-declared payload makes the queue header uncompilable and the closed variant unextendable"
    adr: docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-25
  # --- from adr-registry-staging\ADR-0003 ---
  - pattern: pawn_relevancy_super_or_kind_input
    status: active
    description: "AStealthPawn::IsNetRelevantFor never calls Super and reads only the cull record and viewer relation; no dormancy, cull distance, owner relevancy or team relevancy on pawns"
    why: "Engine Super clauses (controller, owner, based-on) keep concealed or player pawns relevant by kind"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    added: 2026-10-24
  - pattern: force_net_relevant_on_pawn
    status: active
    description: "Never call AActor::ForceNetRelevant or UNetDriver::ForceActorRelevantNextUpdate for a pawn; ForceNetUpdate only inside FStealthForcedNetUpdate"
    why: "Would re-open a culled pawn to every connection or create kind-dependent update timing"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    added: 2026-10-24
  - pattern: multicast_rpc_on_pawn
    status: active
    description: "No multicast RPC on the Shared Pawn; every observable cue is replicated state presented by idempotent handlers"
    why: "RPC presence/timing is a kind tell and is not culled consistently"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    added: 2026-10-24
  - pattern: unlisted_replicated_property
    status: active
    description: "No replicated property, condition or replicated class ships without an allowlist row"
    why: "Default-deny information flow (architecture principle 3)"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0004 ---
  - pattern: tuning_invariant_repair
    status: active
    description: "No code other than F-1 may change a tuning value, and F-1 only clamps a key to its own hard range. Cross-field invariants receive const input and return Pass/Warn/Reject; they never clamp or repair."
    why: "Silent repair hides designer intent and makes the frozen set differ from the authored preset (TDC CR-6, architecture principle 4)."
    adr: docs/architecture/adr-0004-tuning-data-pipeline-validator.md
    added: 2026-10-24
  - pattern: gameplay_value_outside_tuning
    status: active
    description: "No gameplay number as a hardcoded literal, a Config/DefaultConfig property, a UDeveloperSettings field, an ini or Saved/Config value, a command-line option (Shipping) or a console variable."
    why: "CR-1/CR-13: back doors let a local file decide a match and break Pillar 1 uniformity."
    adr: docs/architecture/adr-0004-tuning-data-pipeline-validator.md
    added: 2026-10-24
  - pattern: per_participant_tuning_access
    status: active
    description: "No tuning accessor or helper takes a pawn, controller, team, viewer or participant parameter; no Npc*/Player* twin of an observable key."
    why: "CR-5: per-participant values are a tell (Pillar 1)."
    adr: docs/architecture/adr-0004-tuning-data-pipeline-validator.md
    added: 2026-10-24
  - pattern: client_reads_raw_tuning_asset
    status: active
    description: "Client and presentation code never reference UStealthTuningData or a Public/Server tuning header; they read only GetClientTuning()."
    why: "CR-8/CR-10: the client acts only on the replicated snapshot; typed client face is the compile-time guarantee."
    adr: docs/architecture/adr-0004-tuning-data-pipeline-validator.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0005 ---
  - pattern: authoritative_state_on_travel_actors
    status: active
    description: "No authoritative match state on PlayerController, PlayerState, GameMode or GameState, and nothing keyed by controller or PlayerState pointer; key by ParticipantId (or FSessionPeerKey for the live connection map)."
    why: "Seamless travel replaces controllers and PlayerStates; state on them is silently lost or duplicated."
    adr: docs/architecture/adr-0005-session-seamless-travel-state-stores.md
    added: 2026-10-24
  - pattern: default_login_pawn_spawn
    status: active
    description: "No RestartPlayer, SpawnDefaultPawnFor or pawn spawn on login, rejoin or travel arrival; pawns only from UStealthPawnFactory::SpawnSharedPawn in Round's mixed spawn."
    why: "A pawn appearing without a preceding death identifies a human (Session rule 22, Roster R9)."
    adr: docs/architecture/adr-0005-session-seamless-travel-state-stores.md
    added: 2026-10-24
  - pattern: secret_in_travel_url
    status: active
    description: "Nothing secret in a travel URL or login option, and client code never parses travel URL options."
    why: "The server forwards the travel URL to every client via ClientTravel (5.8.4 GameModeBase.cpp:393-423)."
    adr: docs/architecture/adr-0005-session-seamless-travel-state-stores.md
    added: 2026-10-24
  - pattern: engine_connection_broadcasts
    status: active
    description: "No engine entered/left/renamed messages (ShouldBroadCastWelcomeMessage false), no bIsInactive toggling, no PlayerState removal between Preparing and the next travel, no multicast Session RPC."
    why: "Each is a time-stamped connection-event tell to every client (Session rules 22, 25)."
    adr: docs/architecture/adr-0005-session-seamless-travel-state-stores.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0006 ---
  - pattern: engine_rng_in_gameplay
    status: active
    description: "Gameplay and server code never use FMath::Rand/FRand/RandRange, FRandomStream, std::rand, <random> engines or time-seeded randomness; draws come only from FSecretStream (hidden) or FIntStream (public geometry/decoration)."
    why: "Engine RNGs are invertible and float-derived; they break secrecy (CP-9, CNB-R14) and cross-compiler golden seeds (R-G3)."
    adr: docs/architecture/adr-0006-seeds-random-streams.md
    added: 2026-10-24
  - pattern: public_seed_for_hidden_decision
    status: active
    description: "The public Seed and PublicSubSeed drive only layout geometry, the socket set and client decoration; objective sites, deals, spawn order, placement, emergence, respawn, crowd behaviour and signals draw only from GetServerSubSeed."
    why: "A modified client can replay public draws (Session rule 14); the prototype leaked objective sites this way."
    adr: docs/architecture/adr-0006-seeds-random-streams.md
    added: 2026-10-24
  - pattern: secret_seed_exposure
    status: active
    description: "ServerSecret, MatchNonce, server sub-seeds and stream keys are never logged, traced, replicated, reflected (USTRUCT/UPROPERTY/Blueprint) or placed in a URL; only digests and (Domain, Attempt, StreamTag, counter) tuples may be logged."
    why: "Any exposure lets a client predict hidden draws and identify humans in the crowd (Pillar 1)."
    adr: docs/architecture/adr-0006-seeds-random-streams.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0007 ---
  - pattern: presentation_includes_server_header
    status: active
    description: "StealthPresentation code (incl. AStealthHUD and client wiring) must never include a Public/Server/ header, iterate actors, or call GetGameMode/GetAuthGameMode/GetAllActorsOfClass/GetPlayerControllerIterator."
    why: "On the listen host these reach authoritative server data and break host parity (IVP R10, Roster R6)."
    adr: docs/architecture/adr-0007-code-modules-include-boundaries.md
    added: 2026-10-24
  - pattern: server_type_blueprint_exposed
    status: active
    description: "Server/ UCLASSes without NotBlueprintType, NotBlueprintable; server UINTERFACEs without CannotImplementInterfaceInBlueprint; Blueprint specifiers on server members; UI Blueprints referencing anything off the UI reference allowlist."
    why: "UE exposes subsystems, actors and interfaces to Blueprint by default; widget Blueprints bypass the C++ include guard."
    adr: docs/architecture/adr-0007-code-modules-include-boundaries.md
    added: 2026-10-24
  - pattern: lower_layer_names_feature_type
    status: active
    description: "Foundation or StealthGameplay Core/ code must never include Features/ paths or name a Feature type; upward needs go through consumer-owned interfaces wired by the composition root."
    why: "Prevents layer inversion and module cycles."
    adr: docs/architecture/adr-0007-code-modules-include-boundaries.md
    added: 2026-10-24
  - pattern: registration_outside_composition_root
    status: active
    description: "Registering resolvers, providers or interface implementations from StartupModule, from a feature's own BeginPlay, or with strong pointers."
    why: "No world exists at module startup; strong registrations dangle across PIE worlds and seamless travel."
    adr: docs/architecture/adr-0007-code-modules-include-boundaries.md
    added: 2026-10-24
  - pattern: event_log_through_logs_or_reflection
    status: active
    description: "Event Log entries, DealDigest, server sub-seeds, bindings or mailbox order as arguments of UE_LOG/UE_LOGF/ensureMsgf/checkf/ClientMessage/TRACE_*/CSV_*; Event Log types declared as USTRUCT/UCLASS/UPROPERTY or with string conversions."
    why: "Saved/Logs, traces, reflection dumps and crash dumps are readable by the host (Round R19)."
    adr: docs/architecture/adr-0007-code-modules-include-boundaries.md
    added: 2026-10-24
  - pattern: runtime_depends_on_harness
    status: active
    description: "Any runtime module depending on StealthTestHarness or StealthGameEditor, or the harness listed in a Target.cs ExtraModuleNames."
    why: "Would ship test code in Shipping builds."
    adr: docs/architecture/adr-0007-code-modules-include-boundaries.md
    added: 2026-10-24
  - pattern: prototype_promotion_without_accepted_adr
    status: active
    description: "Moving or copying Source/StealthGame prototype code into a production module before its governing ADR is Accepted, or moving a Blueprint-referenced class without a CoreRedirects entry."
    why: "Prototype code is feasibility evidence, not design (concept Scope Risks)."
    adr: docs/architecture/adr-0007-code-modules-include-boundaries.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0008 ---
