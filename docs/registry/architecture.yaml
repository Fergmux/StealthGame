    description: "Objectives has no tick, FTimerManager timer or latent action; its only timers are TimerFired(StageSignal) items scheduled while a rival release is pending"
    why: "Never a timer, never a reveal (SP-3); one authoritative order (ADR-0002)"
    adr: docs/architecture/adr-0020-objectives-data-team-view.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0021 ---
  - pattern: hud_on_replication_arrival
    status: active
    description: "HUD and marker presentation must never be driven by RepNotify/RPC arrival or UMG animation assets; state is sampled per frame and timed from EstimatedServerNow"
    why: "Arrival order would carry meaning and the listen host gets no RepNotify for its own writes (host parity)"
    adr: docs/architecture/adr-0021-ui-hud-layering-commonui.md
    added: 2026-10-24
  - pattern: commonui_gameplay_input
    status: active
    description: "No gameplay command may be routed through a CommonUI action, domain or activatable; menus open only through UStealthMenuStack::PushMenu after ending outstanding Begins"
    why: "CommonUI flushes pressed keys on the next tick and activation adds contexts, which can strand or duplicate server-meaningful Ends"
    adr: docs/architecture/adr-0021-ui-hud-layering-commonui.md
    added: 2026-10-24
  - pattern: raw_state_input_context_swap
    status: active
    description: "The Informant input context must be selected only by UseInformantContext (raw Informant AND (no presenter OR presented Informant OR past the F4 card-time cap)), never by the raw own State alone that arrives before the blow"
    why: "A pre-contact context swap warns the victim before the strike lands (ASN-R6)"
    adr: docs/architecture/adr-0021-ui-hud-layering-commonui.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0022 ---
  - pattern: per_pawn_render_setting
    status: active
    description: "No code sets a CVar, scalability group, LOD bias, skin-cache usage, render flag or material on one pawn based on kind, team, binding, viewer or on-screen composition; the only per-pawn render inputs are Camera's CPD_EyeMaskAlpha/visibility and Concealment's client latch."
    why: "Any per-pawn rendering difference keyed to identity is a Pillar-1 tell."
    adr: docs/architecture/adr-0022-rendering-performance-budgets.md
    added: 2026-10-24
  - pattern: load_adaptive_quality_scaling
    status: active
    description: "No scaling that feeds back from measured cost or frame time (dynamic resolution, animation budget allocator, adaptive significance budgets, frame-time-driven quality/LOD); fallbacks are fixed global steps applied to every client. ADR-0013's deterministic tier count caps are allowed."
    why: "Cost-driven scaling correlates with what is in view (art bible 8.x.16 never-fallback list)."
    adr: docs/architecture/adr-0022-rendering-performance-budgets.md
    added: 2026-10-24
  - pattern: editor_or_pie_perf_evidence
    status: active
    description: "Performance claims cite only cooked Development standalone captures on the reference preset; PIE/editor numbers are not budget evidence."
    why: "Editor overhead (e.g. 43 ms 3-instance PIE GT) and editor-disabled PSO precache distort every line."
    adr: docs/architecture/adr-0022-rendering-performance-budgets.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0023 ---
  - pattern: gameplay_reads_telemetry
    status: active
    description: "No gameplay, AI, HUD or presentation code reads the telemetry section, and no tuning value changes at runtime from observed rates; telemetry is write-only until the post-termination export."
    why: "CNB-R7 forbids runtime adaptation; a read path would turn recorded player behaviour into a kind-keyed runtime effect."
    adr: docs/architecture/adr-0023-playtest-telemetry-hooks.md
    added: 2026-10-24
  - pattern: kind_conditional_probe
    status: active
    description: "Telemetry probe call sites and detectors are never conditional on controller kind, team or participant state, producers and detectors never pass or compute a kind or team (witnesses recorded as refs, one exposure clock per subject), and per-subject data is keyed by (pawn, binding epoch); the kind label is resolved only inside the sink through the Roster's server query."
    why: "Keeps recording cost and code paths identical for players and NPCs (ADR-0001) and lets r_P and r_N be measured by one mechanism."
    adr: docs/architecture/adr-0023-playtest-telemetry-hooks.md
    added: 2026-10-24
  - pattern: telemetry_in_logs_or_traces
    status: active
    description: "Telemetry types and values never appear in UE_LOG/UE_LOGF, ensureMsgf/checkf text, ClientMessage, TRACE_*, CSV_* or stat/scope names; the T0 lint covers every FTelemetry* type name."
    why: "Saved/Logs and trace captures are readable by the listen host mid-round (Round R19)."
    adr: docs/architecture/adr-0023-playtest-telemetry-hooks.md
    added: 2026-10-24

