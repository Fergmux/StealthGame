  - pattern: ingress_stamps_pawn_current_epoch
    status: active
    description: "Stamping a command with the pawn's current control epoch at ingress instead of the epoch recorded on the commanding controller (or sink) at possession"
    why: "A hand-over bumps the epoch at commit; stamping the current value lets the old owner's commands execute until the possession step"
    adr: docs/architecture/adr-0011-pawn-command-interface-input.md
    added: 2026-10-24
  - pattern: pawnref_resolution_as_visibility
    status: active
    description: "Treating a successful server-side NetGUID resolution of an Attack PawnRef as proof the attacker may know that pawn"
    why: "The server GUID cache resolves culled pawns too (verified 5.8.4); only CanViewerKnow and PawnRefAgreementCm may admit a PawnRef"
    adr: docs/architecture/adr-0011-pawn-command-interface-input.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0012 ---
  - pattern: per_pawn_material_or_appearance_parameter
    status: active
    description: "No UMaterialInstanceDynamic, material parameter, tint, scale, extra component or audio/VFX selector set per pawn or keyed by AppearanceId, viewer, team or local-ness on Shared Pawns; looks come only from the pool row's static MIC and merged mesh."
    why: "A per-pawn parameter surface is a Pillar-1 tell and breaks one look path for everyone (CPA CP-16, art bible 8.x.6)."
    adr: docs/architecture/adr-0012-character-pool-appearance-allocation.md
    added: 2026-10-24
  - pattern: gameplay_asset_load_after_front_end
    status: active
    description: "Gameplay code never loads a character-pool asset (LoadSynchronous, RequestAsyncLoad) after the front end; pool assets are resident by hard reference for the session."
    why: "A first-draw load makes one look slower to appear than another (CPA CP-18)."
    adr: docs/architecture/adr-0012-character-pool-appearance-allocation.md
    added: 2026-10-24
  - pattern: kind_specific_card_path
    status: active
    description: "Card moves never branch on victim kind: one VacateCard for every death or removal, replacement drawn uniformly from all vacant cards, no fresh uniform draw over the active set, no re-sort or grouping of cards by appearance after the deal."
    why: "Conservation and team-blindness (CPA CP-11, CP-12, F-5, F-6); any kind branch or redraw makes copy counts or order carry player-ness."
    adr: docs/architecture/adr-0012-character-pool-appearance-allocation.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0013 ---
  - pattern: engine_uro_on_shared_pawn
    status: active
    description: "Shared Pawn meshes never use engine update-rate optimisation (bEnableUpdateRateOptimizations) or the AnimationBudgetAllocator; update rates come only from the significance subsystem's external tick-rate control."
    why: "5.8.4's default URO rule ticks APlayerController-instigated pawns every frame, so the listen host would animate players and NPCs differently (ADR-0001 §3)."
    adr: docs/architecture/adr-0013-animation-motion-matching-significance.md
    added: 2026-10-24
  - pattern: gameplay_reads_animation
    status: active
    description: "No gameplay rule reads anim notifies, bone/socket transforms or pose curves; gameplay timing comes from server time, the queue and replicated state."
    why: "Pose evaluation rate depends on the host's view and on tiers; rules must not depend on what the host looks at (SCL R11.5)."
    adr: docs/architecture/adr-0013-animation-motion-matching-significance.md
    added: 2026-10-24
  - pattern: animation_fallback_per_pawn
    status: active
    description: "Performance fallbacks (database pruning, cap changes, feature cuts, non-MM locomotion) apply to every pawn and client identically; no per-pawn, per-team or on-screen-composition-keyed scaling, and no notify-driven footsteps."
    why: "Art bible 8.x.16 'never used as a fallback'; tier-dependent audibility or fidelity keyed to who is on screen is a Pillar-1 tell."
    adr: docs/architecture/adr-0013-animation-motion-matching-significance.md
    added: 2026-10-24
  # --- from adr-registry-staging\ADR-0014 ---
  - pattern: runtime_navmesh_rebuild_after_layout_ready
    status: active
    description: "No navmesh tile is rebuilt after OnLayoutReady: nothing spawned or moved afterwards may affect navigation (CanEverAffectNavigation false, no dynamic obstacles or nav modifiers), and no code other than the layout service may add/remove navigation build locks or call UNavigationSystemV1::Build()."
    why: "The navmesh Validate measured must be the one Crowd walks (Crowd CR-18, Generator R-G7); runtime rebuilds cost AI + nav budget and could make pathing event- or kind-dependent."
