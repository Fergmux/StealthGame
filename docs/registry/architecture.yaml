    not: "per-instance or per-kind net config; direct deprecated member access (5.5)"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    reason: "Packet-level parity (IVP R5, SCL R13, AC-IVP-45)"
    referenced_by:
      - docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    added: 2026-10-24
    revised: ""
  - purpose: listen_host_client_update_throttle
    status: active
    # old api (2026-10-24): "[/Script/Engine.Engine] NetClientTicksPerSecond >= MaxConnections x MaxFps so every client is updated every frame (config edit pending user); harness asserts at startup"
    api: "[/Script/Engine.Engine] NetClientTicksPerSecond >= MaxConnections x MaxFps so every client is updated every frame (config edit pending user); MaxFps = host frame-rate limit t.MaxFPS when set, else the 240 fps design ceiling; harness asserts at startup and logs host frames above MaxFps"
    not: "engine default 200 (rotates ~3 of 9 clients per frame at 60 fps)"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    reason: "Un-cull channel open and fallback-feed entries must reach every client in the same frame (F4 T_uncull, TM-R4a); skipped clients otherwise wait one regular update with per-client differences"
    referenced_by:
      - docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    added: 2026-10-24
    revised: "2026-10-25"
  - purpose: listen_host_server_tick
    status: active
    api: "Listen-host server tick = its render frame; rule stated on host frame time: frame rate >= 60 (T_frame <= 1/60 s) at the profiled load, U_eff <= 1/PawnNetUpdateHz + T_frame (SCL F9/I-SCL-10 restated 2026-10-25); checked by the harness frame-time capture (p99)"
    not: "NetServerMaxTickRate integer-multiple / >= 60 startup check (ignored on a listen server unless bClampListenServerTickRate, which also caps the host render rate; [V] GameEngine.cpp:1742); the clamp flag is a recorded alternative pending the user (Config edit)"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    reason: "A NetServerMaxTickRate guard is a no-op on the default listen-server config; the host frame time is what actually quantises pawn update boundaries, identically for every pawn"
    referenced_by:
      - docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
      - docs/architecture/adr-0002-resolution-queue-round-end-staging.md
    added: 2026-10-25
    revised: ""
