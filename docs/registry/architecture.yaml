    not: "magnitude-packed vectors, optional fields, conditional bits"
    adr: docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    reason: "Struct size must not encode kill vs whiff vs reversal (ASN-R21)"
    referenced_by:
      - docs/architecture/adr-0003-replication-relevancy-concealment-cull.md
    added: 2026-10-24
