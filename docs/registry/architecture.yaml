  # --- from adr-registry-staging\ADR-0010 ---
  - pattern: pawn_creation_outside_factory
    status: active
    description: "Spawning, possessing or unpossessing an AStealthPawn anywhere except UStealthPawnFactory (spawn, hand-over pass, takeover) and AStealthPlayerController::PawnLeavingGame; RestartPlayer, SpawnDefaultPawnFor, SpawnDefaultController, AutoPossess"
    why: "Bind-before-visible and possession parity are only enforceable at one creator; engine paths spawn or possess kind-dependently"
