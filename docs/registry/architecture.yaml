  - pattern: gameplay_rpc_on_pawn
    status: active
    description: "Server, Client or NetMulticast gameplay UFUNCTIONs on AStealthPawn or its components; Move/Look RPCs; a Look event"
    why: "Pawn surface must be identical for every kind; one controller RPC resolves its own pawn"
    adr: docs/architecture/adr-0011-pawn-command-interface-input.md
    added: 2026-10-24
  - pattern: reply_outside_drain_end
    status: active
    description: "Sending a command reply, hold status or owner result inline in a slot, at ingress, or on any timing other than the drain-end flush; replying to ingress drops"
    why: "Reply timing would reveal the failure point (timing side channel)"
    adr: docs/architecture/adr-0011-pawn-command-interface-input.md
    added: 2026-10-24
  - pattern: hold_trigger_server_meaning
    status: active
    description: "Using Enhanced Input Hold/HoldAndRelease/Tap/Pulse/Chorded triggers, or client-side timing, to start, end or debounce a server-meaningful hold"
    why: "The server owns every hold timer; client timing is a parity tell and untrusted"
