- id: TR-png-001
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R1: a ping is a momentary place-only ground mark shown to the sender's team only for `PingLifetimeSec`; it never attaches to, follows or is computed from a pawn, the server never receives a pawn identity with it, and there is one ping kind"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-002
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R2, PNG-R5 steps 1-2: a sender may ping only in phase `Active` before Round's latch, with Roster `State` `Active` or `Informant`, a bound pawn and a live connection; one rule for Active players and informants (no role branch, identical entry shape)"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-003
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R2, PNG-R3, PNG-R5 step 2 (rulings D26, D33): a concealed sender cannot ping; the server uses Concealment's `IsInBushOrTransition` (true for every state but `Outside`, so `Emerging` counts) and the owning client the same predicate, fail-closed; only this refusal gives owner-only feedback (refusal tone + 'Not now' plate), invisible to everyone else"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-004
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R3: `IA_Ping` is one Boolean press action (default trigger) in `IMC_Common` for both Active and Informant contexts, rebindable, never routed through Common UI, no hold/chord/repeat, and it never ends or interrupts an outstanding pawn command"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-005
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R3: the ping point is the world query of Camera `GetAimRay()` on `ViewBlock` (pawns and bush foliage ignored; third person re-traced from the eye pivot), dropped at most 300 cm to the first walkable surface; with no hit or no walkable ground nothing is sent"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-006
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "F2: range is measured from the sender pawn's eye pivot on both machines (client `|P - E| <= PingRangeCm`; server `<= PingRangeCm + PingRangeSlackCm`), never from the camera; non-finite points are dropped"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-007
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R3, edge case C-W32: the client gate reads `PresentedOwnState` and the bound-pawn state, never the raw own `State`; from the own fall start until a body is bound nothing is sent; presses in the strike window are dropped server-side with no token, reply, echo, tone or plate"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-008
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R4: transport is `ServerTeamPing(FNetTeamPing {FVector_NetQuantize10 Point})`, a reliable Server RPC on the sender's own `AStealthPlayerController`; it is not a pawn command (never `ServerPawnCommand`, the action slot, the resolution queue or `FActionState`), names no pawn, and the listen host uses the same path"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-009
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R5: server validation in order phase/latch, state/pawn/concealment, range, bucket; the first failure drops silently with the drop reason counted; failures before the bucket step spend no token; no line-of-sight check; acceptance stamps `ServerTime = ServerNow()` and advances the sender's wrapping `PingSeq`"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-010
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "F1: per-participant token bucket (`PingBucketSize`, `PingBucketPerSec`, server tolerance `epsilon = PingBucketPerSec * PingSkewTolSec` with constant 0.1 s), full at `Active` entry, keyed by `ParticipantId` so it survives reconnect, reset only at `OnRosterReset`; the client keeps a strict mirror"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-011
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R6: the carrier is the C-TeamView part `UTeamPingViewComponent` with `FTeamPingView`, a fixed-size array with one slot per team member (slot i = Roster team slot i, never compacted or reordered), each `{SenderHandle, PingSeq, Point, ServerTime}`; no stage, court, site, clue or `RoundEpoch` data; pushed change-only, coalesced per server frame"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-012
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R6, PNG-R9, IVP `TeamPing` row: team-only delivery by relevancy (owner-only PlayerController); opponent machines hold no ping part, entry, RPC, widget or sound, the host included when it is an opponent; the part is on the replicated-property allowlist with Team audience only on `AStealthPlayerController`"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-013
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R6 (ruling D25): one active ring per sender; a new accepted ping overwrites the sender's slot and replaces its ring at once on every client; the replacing ping still spends a token and nothing is refunded"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-014
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R7, F3: a teammate shows a ring for each new `(SenderHandle, PingSeq)` whose age `EstimatedServerNow() - ServerTime` is below `PingLifetimeSec`; age is shown by stepped stroke weight at thirds (never opacity), negative ages clamp to 0, stale arrivals are never shown; the sender sees its ring only from the server echo; one 2D UI tick on arrival"
  created: 2026-10-25
  revised: ""
  status: active

- id: TR-png-015
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R7, VA-PNG-2: rings draw in HUD L0 beneath teammate markers with no depth test, collapse with L0 in the `Neutral` view, and clamp off-screen or behind-camera rings to the safe rectangle as unlabelled edge rings using the Teammate Markers F3 clamp, bias ramp and hysteresis"
