  revised: ""
  status: active

- id: TR-png-016
  system: png
  gdd: design/gdd/informant-pings-team-comms.md
  requirement: "PNG-R7: the ring label is the sender's C-Public `DisplayName` by `SenderHandle` ('Ally' if unresolved); it is dropped at that ally's `OnAllyMarkerRetired` while the ring stays to expiry; the sender's own screen keeps its own-name label"
